<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neyra Naturals | Herbal Hair Oil</title>
<meta name="description" content="Neyra Naturals Herbal Hair Oil for stronger, healthier and thicker hair. 100% herbal. Healthy hair, naturally.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@400;500;700&family=Galada&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
:root{--text-color:#1a1a1a;--muted-color:rgba(0,0,0,.65);--glass-bg:rgba(0,0,0,.04);--glass-border:rgba(0,0,0,.12);--font-main:'Inter',sans-serif;--font-heading:'Galada',cursive;--bg-inner:#fffdf5;--bg-mid:#fdf8e8;--bg-outer:#f8f1dc}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(circle at center,var(--bg-inner) 0%,var(--bg-mid) 50%,var(--bg-outer) 100%);color:var(--text-color);font-family:var(--font-main);overflow:hidden;height:100vh;transition:background 1.2s cubic-bezier(.4,0,.2,1)}
body.gold-theme{--bg-inner:#fffdf5;--bg-mid:#fdf8e8;--bg-outer:#f8f1dc}
#bubbles-container{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bubble-img{position:absolute;pointer-events:none;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9),rgba(245,197,66,.55) 45%,rgba(245,197,66,.15) 70%);aspect-ratio:1}
@keyframes floatUpImg{0%{transform:translateY(0) translateX(0) rotate(0);opacity:0}10%{opacity:.4}90%{opacity:.4}100%{transform:translateY(-110vh) translateX(30px) rotate(360deg);opacity:0}}
.header{display:flex;justify-content:space-between;align-items:center;padding:2rem 4%;padding-top:calc(2rem + env(safe-area-inset-top,0px));position:fixed;top:0;width:100%;z-index:200}
.logo{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:1.3rem;font-family:var(--font-heading)}
.nav{display:flex;gap:.5rem;padding:.4rem;border-radius:100px;background:rgba(0,0,0,.05);border:1px solid rgba(0,0,0,.12);box-shadow:0 8px 32px rgba(0,0,0,.1),inset 0 0 0 1px rgba(255,255,255,.1);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.nav-item{font-family:'Manrope',sans-serif;color:var(--muted-color);text-decoration:none;font-size:.85rem;font-weight:500;padding:.5rem 1.2rem;border-radius:100px;transition:all .3s ease}
.nav-item:hover,.nav-item.active{background:#fbcfe8;color:#011d17}
.contact-btn{background:rgba(0,0,0,.5);color:#fff;border:none;padding:.9rem 2rem;border-radius:100px;font-weight:600;font-size:.85rem;cursor:pointer;transition:all .3s ease}
.contact-btn:hover{background:rgba(0,0,0,.7);transform:translateY(-2px)}
.hero{height:100vh;display:flex;align-items:center;justify-content:center;padding:0 4%;padding-top:5rem}
.hero-content{display:flex;justify-content:space-between;align-items:stretch;width:100%;height:100%;position:relative}
.main-title,.side-title{font-family:var(--font-heading);font-size:clamp(5rem,10vw,12rem);line-height:.8;font-weight:400;white-space:nowrap;color:#1a1a1a}
.leaves-container,.berries-container,.berries-container-bg{position:absolute;inset:0;pointer-events:none;transition:transform .1s ease-out}
.leaves-container{z-index:-1}.berries-container{z-index:0}.berries-container-bg{z-index:0}
.leaf{position:absolute;width:60px;height:60px;font-size:60px;line-height:1;filter:drop-shadow(0 5px 15px rgba(0,0,0,.2))}
.l1{top:10%;left:15%}.l2{top:40%;left:80%;width:140px;height:140px;font-size:140px;opacity:.4}.l3{top:70%;left:75%;width:80px;height:80px;font-size:80px}.l4{top:85%;left:20%;width:120px;height:120px;font-size:120px;opacity:.3}
.hero-left{display:flex;flex-direction:column;height:100%;padding:6rem 0;gap:2rem;z-index:100}
.description{color:var(--muted-color);font-size:1.1rem;line-height:1.6;max-width:400px}
.primary-btn{display:flex;align-items:center;gap:1.5rem;background:rgba(0,0,0,.5);color:#fff;border:none;padding:.4rem .4rem .4rem 1.5rem;border-radius:100px;font-weight:700;cursor:pointer;width:fit-content;transition:all .3s ease}
.primary-btn:hover{background:rgba(0,0,0,.7);transform:translateY(-3px)}
.plus-icon{background:#fbcfe8;color:#011d17;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:1.4rem;font-weight:900;line-height:1;padding-bottom:2px}
.award-badge{display:flex;align-items:center;gap:1rem;margin-top:auto}
.award-icon{width:48px;height:48px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:12px;display:flex;align-items:center;justify-content:center}
.award-text{display:flex;flex-direction:column}
.award-title{font-size:.7rem;letter-spacing:.1em;color:var(--muted-color)}
.award-subtitle{font-size:.85rem;font-weight:600}
.berry{position:absolute;width:120px;height:120px;font-size:120px;line-height:1;text-align:center;filter:drop-shadow(0 10px 20px rgba(0,0,0,.3))}
.b1{top:25%;left:30%;width:100px;height:100px;font-size:90px}
.b2{top:60%;left:42%;width:46px;height:46px;font-size:40px}
.b3{top:30%;left:62%;width:110px;height:110px;font-size:98px}
.b4{top:15%;left:48%;width:62px;height:62px;font-size:55px}
.b5{top:75%;left:20%;width:54px;height:54px;font-size:48px}
.b6{top:45%;left:75%;width:80px;height:80px;font-size:70px}
.b7{top:15%;left:40%;width:44px;height:44px;font-size:38px;opacity:.7}
.b8{top:50%;left:55%;width:38px;height:38px;font-size:34px;opacity:.6}
.b9{top:80%;left:35%;width:40px;height:40px;font-size:36px;opacity:.7}
.hero-center{display:flex;justify-content:center;align-items:center;position:absolute;inset:0;z-index:1;opacity:0;animation:fadeIn 1.5s ease-out .3s forwards,float 6s ease-in-out infinite;pointer-events:none;background:radial-gradient(circle at center,rgba(245,197,66,.1) 0%,transparent 70%)}
@keyframes fadeIn{to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
#product-model{height:62vh;width:auto;max-width:90vw;display:block;transform:rotate(12deg);filter:drop-shadow(0 30px 40px rgba(0,0,0,.45));will-change:transform}
.hero-right{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;text-align:right;height:100%;padding:6rem 0;z-index:100;width:450px;pointer-events:none}
.product-carousel{display:flex;flex-direction:column;gap:1.5rem;align-items:flex-end;pointer-events:auto}
.carousel-cards{display:flex;gap:1rem}
.card{background:var(--glass-bg);border:1px solid var(--glass-border);padding:1rem;padding-top:5rem;border-radius:28px;display:flex;flex-direction:column;align-items:center;gap:1.5rem;cursor:pointer;transition:all .4s cubic-bezier(.175,.885,.32,1.275);width:135px;position:relative;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-align:center}
.card:hover{background:rgba(0,0,0,.08);border-color:rgba(0,0,0,.25)}
.card.active{border-color:#fbcfe8}
.card img{width:52px;height:auto;margin-top:-8rem;filter:drop-shadow(0 20px 35px rgba(0,0,0,.5));transition:transform .5s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
.card:hover img{transform:translateY(-30px) rotate(-12deg) scale(1.15)}
.card-info{display:flex;flex-direction:column;font-size:.7rem;width:100%}
.card-info span:first-child{font-weight:600}.card-info span:last-child{color:var(--muted-color)}
.carousel-nav{display:flex;gap:1rem}
.nav-arrow{background:var(--glass-bg);border:1px solid var(--glass-border);color:#1a1a1a;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .3s}
.nav-arrow:hover{background:rgba(0,0,0,.08)}
.side-title{align-self:flex-end;text-align:right}
@media (max-width:1200px){#product-model{height:50vh}#product-model.big{height:60vh}.main-title,.side-title{font-size:5rem}.hero-right{align-items:center;text-align:center}.side-title{align-self:center;text-align:center}}
@media (max-width:900px){
html{height:auto}
body{height:auto;min-height:100vh;overflow-x:hidden;overflow-y:auto;background-attachment:fixed}
.header{position:absolute;padding:1rem 5%;padding-top:calc(1rem + env(safe-area-inset-top,0px))}
.contact-btn{padding:.65rem 1.2rem;font-size:.8rem}
.nav{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:250;max-width:94vw;overflow-x:auto;padding:.3rem;gap:.1rem;background:rgba(255,251,238,.92)}
.nav-item{font-size:.7rem;padding:.5rem .65rem;white-space:nowrap}
.hero{height:auto;min-height:100vh;padding:0 5%;padding-top:6.5rem;padding-bottom:6.5rem}
.hero-content{flex-direction:column;align-items:center;height:auto;gap:1.1rem}
.hero-left,.hero-right{display:contents}
.main-title{order:1;font-size:3.6rem;text-align:center;line-height:.85}
.hero-center{order:2;position:relative;inset:auto;width:100%;height:auto;background:none;margin:.2rem 0}
#product-model{height:36vh;max-height:310px;max-width:80vw}#product-model.big{height:46vh;max-height:400px}
.description{order:3;text-align:center;font-size:.95rem;max-width:340px}
.cta-group{order:4;display:flex;justify-content:center}
.product-carousel{order:5;align-items:center;margin-top:4.5rem}
.side-title{order:6;font-size:3.4rem;align-self:center;text-align:center;line-height:.85;margin-top:.5rem}
.award-badge{order:7;margin-top:.5rem;justify-content:center}
.logo img{height:78px}
.overlay{padding:4.5rem 4% 5.5rem}
.panel{padding:1.3rem;border-radius:22px}
.panel h3{font-size:2rem}
}

.overlay{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:6rem 4% 2rem;background:rgba(252,250,245,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.overlay.open{display:flex}
.panel{width:min(760px,100%);max-height:100%;overflow:auto;background:#ffffff;border:1px solid rgba(0,0,0,.1);border-radius:28px;padding:2rem;box-shadow:0 12px 40px rgba(0,0,0,.08);position:relative}
.panel h3{font-family:var(--font-heading);font-weight:400;font-size:2.4rem;margin-bottom:.4rem}
.panel .sub{color:var(--muted-color);font-size:.9rem;margin-bottom:1.2rem}
.close{position:absolute;top:1rem;right:1rem;width:36px;height:36px;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass-bg);color:#1a1a1a;cursor:pointer;font-size:1rem}
.ing{display:grid;grid-template-columns:1fr;gap:.15rem .8rem;padding:.55rem 0;border-bottom:1px solid var(--glass-border);font-size:.85rem}
.ing b{font-weight:600}.ing small{color:var(--muted-color);grid-column:1}
.list{list-style:none;display:grid;gap:.7rem}.list li{padding:.9rem 1.1rem;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 1.2rem;margin-bottom:.7rem;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:18px}
.row b{font-size:1.1rem}.row span{color:var(--muted-color);font-size:.85rem;text-align:right}.row strong{color:#fbcfe8}
.logo img{height:120px;width:auto;display:block;border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.35)}


.mode-toggle{width:42px;height:42px;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass-bg);color:var(--text-color);font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .3s ease,background .3s ease;flex-shrink:0}
.mode-toggle:hover{transform:scale(1.1) rotate(15deg)}
body.dark{--text-color:#fff;--muted-color:rgba(255,255,255,.7);--glass-bg:rgba(255,255,255,.05);--glass-border:rgba(255,255,255,.1);--bg-inner:#2a1450;--bg-mid:#150a2e;--bg-outer:#05020d}
body.dark.gold-theme{--bg-inner:#3d3508;--bg-mid:#1f1b04;--bg-outer:#080701}
body.dark .main-title,body.dark .side-title,body.dark .nav-arrow,body.dark .close{color:#fff}
body.dark .nav{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
body.dark .card:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4)}
body.dark .nav-arrow:hover{background:rgba(255,255,255,.1)}
body.dark .overlay{background:rgba(0,0,0,.45)}
body.dark .panel{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);box-shadow:0 8px 32px rgba(0,0,0,.3)}
@media(max-width:900px){body.dark .nav{background:rgba(0,0,0,.45)}}
</style>

const order=['b1','b2','b3','b4','b5','b6','b7','b8','b9'];
let isSwitching=false,switchSpin=0;

cards.forEach(card=>card.addEventListener('click',()=>{
  if(isSwitching)return;
  cards.forEach(c=>c.classList.remove('active'));
  card.classList.add('active');
  switchFlavor(card.dataset.flavor);
}));
document.querySelectorAll('.nav-arrow').forEach(btn=>btn.addEventListener('click',()=>{
  const i=[...cards].findIndex(c=>c.classList.contains('active'));
  cards[(i+1)%cards.length].click();
}));

function applyLabel(flavor){
  const gold=flavor==='gold';
  document.body.classList.toggle('gold-theme',gold);
  bottle.src=gold?B200:B100;bottle.classList.toggle('big',gold);
}

function switchFlavor(flavor){
  if(isSwitching)return;
  isSwitching=true;
  const heroCenter=document.querySelector('.hero-center');
  const colors=window.__bgColors(flavor);
  gsap.to(document.body,{'--bg-inner':colors.inner,'--bg-mid':colors.mid,'--bg-outer':colors.outer,duration:1.5,ease:'power2.inOut'});

  const s={val:0,blur:0};
  gsap.to(s,{val:360,blur:15,duration:.6,ease:'power2.in',
    onUpdate:()=>{switchSpin=s.val;bottle.style.filter=`blur(${s.blur}px) drop-shadow(0 30px 40px rgba(0,0,0,.45))`},
    onComplete:()=>{
      applyLabel(flavor);
      gsap.to(s,{val:720,blur:0,duration:1.5,ease:'back.out(0.7)',
        onUpdate:()=>{switchSpin=s.val;bottle.style.filter=`blur(${s.blur}px) drop-shadow(0 30px 40px rgba(0,0,0,.45))`},
        onComplete:()=>{switchSpin=0;bottle.style.filter='drop-shadow(0 30px 40px rgba(0,0,0,.45))'}
      });
    }});

  let done=0;
  allBerries.forEach((berry,i)=>{
    const cx=window.innerWidth/2-berry.offsetLeft-berry.offsetWidth/2;
    const cy=window.innerHeight/2-berry.offsetTop-berry.offsetHeight/2;
    const a=parseFloat(berry.dataset.angle)||0;
    const nx=(Math.random()-.5)*200,ny=(Math.random()-.5)*200;
    gsap.set(berry,{rotation:a,x:parseFloat(berry.dataset.baseX)||0,y:parseFloat(berry.dataset.baseY)||0});
    gsap.timeline()
      .to(berry,{x:cx,y:cy,rotation:a+45,scale:.1,opacity:0,duration:.5,ease:'power2.in',
        onComplete:()=>{berry.textContent=(flavor==='gold'?SET_B:SET_A)[i];heroCenter.style.zIndex=50}})
      .to(berry,{duration:.3})
      .to(berry,{onStart:()=>{heroCenter.style.zIndex=1},x:nx,y:ny,rotation:a+90,scale:1,opacity:1,duration:.9,ease:'back.out(1.5)',
        onComplete:()=>{
          berry.dataset.angle=a+90;berry.dataset.baseX=nx;berry.dataset.baseY=ny;berry.dataset.rx=0;berry.dataset.ry=0;
          if(++done===allBerries.length)isSwitching=false;
        }});
  });
}

allBerries.forEach(b=>{b.dataset.rx=0;b.dataset.ry=0;b.dataset.angle=Math.random()*360;b.dataset.baseX=0;b.dataset.baseY=0});
let mouse={x:0,y:0,px:-9999,py:-9999},cur={x:0,y:0};
addEventListener('mousemove',e=>{mouse.x=e.clientX/innerWidth-.5;mouse.y=e.clientY/innerHeight-.5;mouse.px=e.clientX;mouse.py=e.clientY});
addEventListener('touchmove',e=>{const t=e.touches[0];mouse.x=t.clientX/innerWidth-.5;mouse.y=t.clientY/innerHeight-.5;mouse.px=t.clientX;mouse.py=t.clientY},{passive:true});
const durs=[5,7,6,8,5.5,6.5,9,11,10];

function animate(){
  const t=Date.now()*.001;
  cur.x+=(mouse.x-cur.x)*.05;cur.y+=(mouse.y-cur.y)*.05;
  bottle.style.transform=`perspective(1000px) rotate(12deg) rotateY(${cur.x*40+switchSpin}deg) rotateX(${-cur.y*20}deg)`;
  berriesFG.style.transform=`translate(${cur.x*60}px,${cur.y*60}px)`;
  berriesBG.style.transform=`translate(${cur.x*-30}px,${cur.y*-30}px)`;
  leavesBG.style.transform=`translate(${cur.x*-15}px,${cur.y*-15}px)`;
  if(!isSwitching){
    allBerries.forEach((berry,i)=>{
      const r=berry.getBoundingClientRect();
      const dx=mouse.px-(r.left+r.width/2),dy=mouse.py-(r.top+r.height/2);
      const d=Math.sqrt(dx*dx+dy*dy)||1;
      let tx=0,ty=0,sm=1;
      if(d<400){const f=(400-d)/400;tx=dx/d*f*-80;ty=dy/d*f*-80;sm=1+f*5}
      let rx=parseFloat(berry.dataset.rx)||0,ry=parseFloat(berry.dataset.ry)||0,ang=parseFloat(berry.dataset.angle)||0;
      const bx=parseFloat(berry.dataset.baseX)||0,by=parseFloat(berry.dataset.baseY)||0;
      rx+=(tx-rx)*.1;ry+=(ty-ry)*.1;ang+=.2*sm;
      berry.dataset.rx=rx;berry.dataset.ry=ry;berry.dataset.angle=ang;
      const ph=(t+i*.7)*(Math.PI*2/durs[i%9]);
      berry.style.transform=`translate(${rx+bx}px,${ry+by+Math.sin(ph)*15}px) rotate(${ang+Math.cos(ph)*6}deg)`;
    });
  }
  document.querySelectorAll('.leaf').forEach((leaf,i)=>{
    const ph=(t+i*1.2)*(Math.PI*2/(10+i*2));
    leaf.style.transform=`translate(${Math.cos(ph*.5)*15}px,${Math.sin(ph)*20}px) rotate(${Math.sin(ph*.3)*15}deg)`;
  });
  requestAnimationFrame(animate);
}
animate();

<script>

  var dark=document.body.classList.contains('dark');
  if(!dark)return {inner:'#fffdf5',mid:'#fdf8e8',outer:'#f8f1dc'};
  return flavor==='gold'?{inner:'#3d3508',mid:'#1f1b04',outer:'#080701'}:{inner:'#2a1450',mid:'#150a2e',outer:'#05020d'};
};
